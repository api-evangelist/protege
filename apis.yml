aid: protege
name: Protege
description: >-
  Protege (Protege Health Inc.) is a two-sided data platform that connects AI model builders with
  high-quality, real-world proprietary datasets for pre-training, post-training, fine-tuning, and
  evaluation. It curates data from hundreds of sources across healthcare, video, audio and speech,
  motion capture, architecture/engineering/construction, manufacturing, energy, finance, and
  agriculture, handling licensing and rights protection while fairly compensating data rights
  holders. Protege also operates DataLab, a research team focused on data-for-AI challenges. The
  company is backed by Andreessen Horowitz, CRV, Bloomberg Beta, Footwork, Flex Capital, SV Angel,
  Liquid, and Shaper Capital. As of this enrichment pass Protege publishes no public API, developer
  portal, or SDKs; this profile captures its identity and web properties.
